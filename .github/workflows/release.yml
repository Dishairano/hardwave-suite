name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual test builds. No tag means no release is published: the bundles are
  # attached to the run as artefacts instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set version from tag
        # Tag pushes only. On a manual run GITHUB_REF is a branch, which is not
        # a semver string and fails the Tauri config parse.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            for (const f of ['src-tauri/tauri.conf.json', 'package.json']) {
              const j = JSON.parse(fs.readFileSync(f));
              j.version = '${VERSION}';
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "

      - name: Install frontend dependencies
        run: npm install

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/certificate.p12

      - name: Build Tauri
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri:build -- --target ${{ matrix.target }}
          else
            npm run tauri:build
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign Windows binaries
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $cert = Import-PfxCertificate -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $thumbprint = $cert.Thumbprint

          # Sign all .exe and .msi files in the bundle directory
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $thumbprint $_.FullName
            Write-Output "Signed: $($_.Name)"
          }

          Remove-Item $certPath -Force

      - name: Create portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "staging/Hardwave Suite"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Grab the raw Tauri-built executable (what NSIS would install).
          $rawExe = Get-ChildItem -Path src-tauri/target/release -Filter "hardwave-suite.exe" -File | Select-Object -First 1
          if (-not $rawExe) { throw "hardwave-suite.exe not found in target/release" }
          Copy-Item $rawExe.FullName "$staging/Hardwave Suite.exe"

          # Include any resource DLLs sitting next to the binary (e.g. WebView2Loader if not statically linked).
          Get-ChildItem -Path src-tauri/target/release -Filter *.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$staging/"
          }

          # Include resources dir if Tauri produced one next to the binary.
          if (Test-Path "src-tauri/target/release/resources") {
            Copy-Item "src-tauri/target/release/resources" "$staging/resources" -Recurse
          }

          # Zip as the payload the installer will download.
          Compress-Archive -Path "$staging/*" -DestinationPath "hardwave-suite-portable-windows.zip" -Force
          Get-Item hardwave-suite-portable-windows.zip | Select-Object Name,Length

      - name: Build Hardwave Suite installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: installer
        run: |
          npm install
          # Skip the Tauri bundler: we want the raw .exe, not another NSIS wrap.
          npm run tauri:build -- --no-bundle

      - name: Stage installer as HardwaveSuite-Setup.exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installerExe = Get-ChildItem -Path installer/src-tauri/target/release -Filter "hardwave-suite-installer.exe" -File | Select-Object -First 1
          if (-not $installerExe) { throw "hardwave-suite-installer.exe not found" }
          Copy-Item $installerExe.FullName "HardwaveSuite-Setup.exe"
          Get-Item HardwaveSuite-Setup.exe | Select-Object Name,Length

      - name: Sign HardwaveSuite-Setup.exe
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "installer-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $cert = Import-PfxCertificate -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $cert.Thumbprint HardwaveSuite-Setup.exe
          Remove-Item $certPath -Force

      - name: Upload Windows artifacts
        if: startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'windows-latest')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            HardwaveSuite-Setup.exe
            hardwave-suite-portable-windows.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Name the macOS updater bundle per architecture
        # Both macOS matrix jobs bundle a file called exactly
        # "Hardwave Suite.app.tar.gz" and upload it to the same release, so
        # whichever job finished last silently replaced the other and every
        # Mac was served that one architecture. The .dmg bundles already carry
        # the arch in their names; the updater tarball now does too.
        #
        # The lipo check is the guard that was missing: an Intel binary
        # published under darwin-aarch64 looks fine everywhere except on a
        # customer's Mac.
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) SLUG=aarch64; WANT=arm64  ;;
            x86_64-apple-darwin)  SLUG=x64;     WANT=x86_64 ;;
            *) echo "unexpected macOS target ${{ matrix.target }}" >&2; exit 1 ;;
          esac

          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          SRC=$(ls "$DIR"/*.app.tar.gz | head -1)
          [ -n "$SRC" ] || { echo "no .app.tar.gz in $DIR" >&2; exit 1; }
          [ -f "$SRC.sig" ] || { echo "no signature beside $SRC" >&2; exit 1; }

          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Hardwave Suite.app"
          GOT=$(lipo -archs "$APP/Contents/MacOS/hardwave-suite")
          echo "built for: $GOT (expected $WANT)"
          case " $GOT " in
            *" $WANT "*) ;;
            *) echo "wrong architecture: built $GOT, expected $WANT" >&2; exit 1 ;;
          esac

          mv "$SRC"     "$DIR/Hardwave.Suite_${SLUG}.app.tar.gz"
          mv "$SRC.sig" "$DIR/Hardwave.Suite_${SLUG}.app.tar.gz.sig"
          ls -la "$DIR"

      - name: Upload macOS artifacts
        if: startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'macos-latest')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Linux artifacts
        if: startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'ubuntu-22.04')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload bundles for manual test runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: suite-test-${{ matrix.platform }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn


  deploy-update:
    needs: build
    runs-on: ubuntu-latest
    # A manual run has no tag, so there is no release to attach an updater
    # manifest to. Publishing here would point live installs at nothing.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p /tmp/release-assets /tmp/sigs /tmp/sigs-mac /tmp/sigs-linux

          # Download updater binaries + signatures
          gh release download "${TAG}" -p "*.exe" -p "*.exe.sig" -D /tmp/release-assets 2>/dev/null || true
          gh release download "${TAG}" -p "*.app.tar.gz" -p "*.app.tar.gz.sig" -D /tmp/release-assets 2>/dev/null || true
          gh release download "${TAG}" -p "*.AppImage" -p "*.AppImage.sig" -D /tmp/release-assets 2>/dev/null || true

          ls -la /tmp/release-assets/

      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://hardwavestudios.com/downloads/suite"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Release notes: prefer the ANNOTATED TAG MESSAGE — softprops/action-gh-release
          # does NOT copy it into the release body, which is why the auto-updater
          # used to show a generic "Bug fixes and improvements". Fall back to any
          # existing release body, then to the generic line. Also push the result
          # into the GitHub release body so the release page and the updater
          # manifest stay in sync.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          NOTES=$(git tag -l --format='%(contents)' "${TAG}" 2>/dev/null)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(gh release view "${TAG}" --json body -q '.body' 2>/dev/null)
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Bug fixes and improvements"
          fi
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          gh release edit "${TAG}" --notes-file /tmp/release-notes.md 2>/dev/null || true

          # Read signatures from downloaded assets
          WIN_SIG=$(cat /tmp/release-assets/*.exe.sig 2>/dev/null || echo "")
          # One signature per macOS architecture. Empty is fatal: publishing a
          # manifest with a blank signature makes every Mac update fail with a
          # verification error rather than an obvious build failure here.
          MAC_ARM_SIG=$(cat /tmp/release-assets/Hardwave.Suite_aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          MAC_X64_SIG=$(cat /tmp/release-assets/Hardwave.Suite_x64.app.tar.gz.sig 2>/dev/null || echo "")
          for pair in "aarch64:$MAC_ARM_SIG" "x64:$MAC_X64_SIG"; do
            if [ -z "${pair#*:}" ]; then
              echo "missing macOS signature for ${pair%%:*}" >&2; exit 1
            fi
          done
          LINUX_SIG=$(cat /tmp/release-assets/*.AppImage.sig 2>/dev/null || echo "")

          # Build latest.json with hardwavestudios.com URLs
          python3 -c "
          import json
          manifest = {
            'version': '${VERSION}',
            'notes': open('/tmp/release-notes.md').read().strip() or 'Bug fixes and improvements',
            'pub_date': '${DATE}',
            'platforms': {
              'windows-x86_64': {
                'signature': '''${WIN_SIG}''',
                'url': '${BASE}/Hardwave.Suite_${VERSION}_x64-setup.exe'
              },
              'darwin-aarch64': {
                'signature': '''${MAC_ARM_SIG}''',
                'url': '${BASE}/Hardwave.Suite_aarch64.app.tar.gz'
              },
              'darwin-x86_64': {
                'signature': '''${MAC_X64_SIG}''',
                'url': '${BASE}/Hardwave.Suite_x64.app.tar.gz'
              },
              'linux-x86_64': {
                'signature': '''${LINUX_SIG}''',
                'url': '${BASE}/Hardwave.Suite_${VERSION}_amd64.AppImage'
              }
            }
          }
          with open('/tmp/latest.json', 'w') as f:
            json.dump(manifest, f, indent=2)
          "

          cat /tmp/latest.json

          # Also upload to GitHub release as asset
          gh release upload "${TAG}" /tmp/latest.json --clobber

      - name: Deploy to hardwavestudios.com
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Set up SSH
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 46.225.219.184 >> ~/.ssh/known_hosts 2>/dev/null

          REMOTE="root@46.225.219.184"
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Create release directory on server
          $SSH $REMOTE "mkdir -p /opt/hardwave/public-downloads/suite-releases"

          # Upload binaries (only updater-relevant files: .exe, .app.tar.gz, .AppImage + sigs)
          $SCP /tmp/release-assets/* $REMOTE:/opt/hardwave/public-downloads/suite-releases/

          # Upload manifest
          $SCP /tmp/latest.json $REMOTE:/opt/hardwave/public-downloads/hardwave-suite-latest.json

          echo "Deployed to hardwavestudios.com"

          # Clean up
          rm -f ~/.ssh/deploy_key
