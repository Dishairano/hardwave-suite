[package]
name = "hardwave-suite"
version = "0.23.1"
edition = "2021"

[lib]
name = "hardwave_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
dirs = "5"
futures-util = "0.3"
zip = "2"
flate2 = "1"
tar = "0.4"
tauri-plugin-dialog = "2.6.0"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
sha2 = "0.10"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
semver = "1"
# Reads the expiry from a JWT's payload (session.rs).
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
tauri-plugin-opener = "2"
# WinVerifyTrust, for the signature of a downloaded uninstaller; the Security,
# Authorization and Threading parts keep the plug-ins' token file user-only.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
